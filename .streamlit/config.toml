[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = false

[client]
toolbarMode = "minimal"

# Surface/ink values match the chart tokens in src/pain_tracker/charts.py so Plotly
# figures (transparent background) sit on exactly the colour they were validated against.
[theme]
font = "sans-serif"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#242422"
textColor = "#f0efec"
borderColor = "#383835"
