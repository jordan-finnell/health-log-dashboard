# Maps the Google Sheet's column headers to stable keys used by the code.
# This is the schema live mode reads by default (the author's own log). Demo mode uses the
# separate generic schema in config/demo.toml. To point live mode at a different sheet,
# copy this file to config/metrics.toml (gitignored; preferred when it exists) and edit it.
# Metric order is stable: it fixes each metric's chart colour.

[timestamp]
column = "Timestamp"

# min/max define the valid rating scale; values outside it are treated as missing.
# The survey uses a 0-10 scale for every metric.
# higher_is_better drives chart colours and "improving / worsening" wording.

[[metrics]]
key = "headache"
column = "Headache Severity"
label = "Headache"
min = 0
max = 10
higher_is_better = false

[[metrics]]
key = "fatigue"
column = "Fatigue / Body Aches"
label = "Fatigue / aches"
min = 0
max = 10
higher_is_better = false

[[metrics]]
key = "depression"
column = "Depression"
label = "Depression"
min = 0
max = 10
higher_is_better = false

[[metrics]]
key = "anxiety"
column = "Anxiety"
label = "Anxiety"
min = 0
max = 10
higher_is_better = false

[[metrics]]
key = "excitement"
column = "Excitement"
label = "Excitement"
min = 0
max = 10
higher_is_better = true

# Added to the survey partway through the log, so earlier rows are blank.
[[metrics]]
key = "neck_pain"
column = "Neck Pain"
label = "Neck pain"
min = 0
max = 10
higher_is_better = false
